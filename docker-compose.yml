services:
  client:
    restart: unless-stopped
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

  server:
    restart: unless-stopped
    build:
      context: ./server
    environment:
      POSTGRES_URL: "postgres://postgres:w3eJkyN2ygY@db:5432/base"
    expose:
      - 3000
    volumes:
      - ./server:/app
    depends_on:
      - db

  db:
    restart: unless-stopped
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "w3eJkyN2ygY"
      POSTGRES_DB: "base"
    ports:
      - "5432:5432"
    volumes:
      - ./data/psql:/var/lib/postgresql/data

